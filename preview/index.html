<script>
const layout=document.querySelector('.layout');
const areas={
 overview:{label:'Overview',pages:[{title:'Dashboard',view:'status-view'},{title:'Connected devices',description:'Client addresses, connection types and lease information.'}]},
 network:{label:'Network',pages:[{title:'Interfaces',view:'interfaces-view',action:'Add interface'},{title:'Devices',description:'Ethernet devices, bridges and VLAN membership.'},{title:'Wireless',description:'Radios, wireless networks and associated stations.'},{title:'Firewall',description:'Zones, traffic rules and port forwarding.'},{title:'Routing',description:'Static routes and policy routing.'}]},
 traffic:{label:'Traffic control',pages:[{title:'Bandwidth',description:'Upload and download limits, with applied policy status.'},{title:'Priority',description:'Traffic classification and scheduling policies.'}]},
 services:{label:'Services',pages:[{title:'Applications',description:'Pages provided by installed service packages appear here.'}]},
 system:{label:'System',pages:[{title:'Administration',description:'Access, time, language and device settings.'},{title:'Software',description:'Installed packages and available updates.'},{title:'Backup & firmware',description:'Configuration backups and firmware upgrades.'},{title:'Logs',description:'System and kernel event records.'},{title:'Diagnostics',description:'Ping, traceroute and connection checks.'}]}
};
let currentArea='overview';
let noticeTimer;
const remembered={};
function notice(message){document.querySelector('.notice').textContent=message;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>document.querySelector('.notice').textContent='',3000);}
function openPage(area,index=0){
 currentArea=area;remembered[area]=index;
 const config=areas[area],selected=config.pages[index],tabs=document.querySelector('.tabs');
 tabs.setAttribute('aria-label',config.label+' pages');tabs.replaceChildren();
 config.pages.forEach((page,i)=>{
  const button=document.createElement('button');button.type='button';button.textContent=page.title;button.id='page-tab-'+i;button.setAttribute('role','tab');button.setAttribute('aria-selected',String(i===index));button.setAttribute('aria-controls','page-content');button.tabIndex=i===index?0:-1;
  button.addEventListener('click',()=>{openPage(area,i);document.querySelector('#page-tab-'+i).focus();});
  tabs.append(button);
 });
 document.querySelector('#title').textContent=selected.title;
 const content=document.querySelector('#page-content');content.setAttribute('aria-labelledby','page-tab-'+index);content.replaceChildren();
 if(selected.view)content.append(document.querySelector('#'+selected.view).content.cloneNode(true));
 else{const preview=document.createElement('div');preview.className='page-placeholder';const description=document.createElement('p');description.textContent=selected.description;const small=document.createElement('small');small.textContent='Layout preview. Controls and live data are not connected.';preview.append(description,small);content.append(preview);}
 const action=document.querySelector('.page-action');action.hidden=!selected.action;action.querySelector('span').textContent=selected.action||'';
 for(const item of document.querySelectorAll('[data-page]')){const active=item.dataset.page===area;item.classList.toggle('active',active);if(active)item.setAttribute('aria-current','page');else item.removeAttribute('aria-current');}
}
for(const button of document.querySelectorAll('[data-mode]'))button.addEventListener('click',()=>{document.documentElement.dataset.theme=button.dataset.mode;for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b===button));});
for(const item of document.querySelectorAll('[data-page]'))item.addEventListener('click',event=>{event.preventDefault();openPage(item.dataset.page,remembered[item.dataset.page]||0);layout.classList.remove('menu-open');document.querySelector('.mobile-toggle').setAttribute('aria-expanded','false');document.querySelector('#page-tab-'+(remembered[item.dataset.page]||0)).focus();});
document.querySelector('.mobile-toggle').addEventListener('click',event=>{const open=layout.classList.toggle('menu-open');event.currentTarget.setAttribute('aria-expanded',String(open));});
document.querySelector('.tabs').addEventListener('keydown',event=>{const count=areas[currentArea].pages.length;let index=remembered[currentArea]||0;if(event.key==='ArrowRight')index=(index+1)%count;else if(event.key==='ArrowLeft')index=(index+count-1)%count;else if(event.key==='Home')index=0;else if(event.key==='End')index=count-1;else return;event.preventDefault();openPage(currentArea,index);document.querySelector('#page-tab-'+index).focus();});
document.querySelector('.main').addEventListener('click',event=>{
 const jump=event.target.closest('[data-jump]');
 if(jump){event.preventDefault();openPage(jump.dataset.jump,Number(jump.dataset.index)||0);document.querySelector('#page-tab-'+(Number(jump.dataset.index)||0)).focus();return;}
 const pause=event.target.closest('#pause-dashboard');
 if(pause){const paused=pause.getAttribute('aria-pressed')!=='true';pause.setAttribute('aria-pressed',String(paused));pause.textContent=paused?'Resume':'Pause';notice('Sample data only. The live dashboard will '+(paused?'pause':'resume')+' polling.');return;}
 if(event.target.closest('.demo-action'))notice('Visual preview only. No router settings are changed.');
});
document.querySelector('.main').addEventListener('change',event=>{if(event.target.matches('#refresh-rate'))notice('Sample data only. This control previews the live refresh preference.');});
openPage('overview');
</script>
